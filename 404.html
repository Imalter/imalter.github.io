<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Page not found — Playfocus</title>
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#ffffff">
	<link href="/src/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
	<link href="/src/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
	<link href="/src/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
	<link rel="preload" href="/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
	<style>
		/* Onest (SIL OFL 1.1, see fonts/OFL.txt), self-hosted variable font */
		@font-face {
			font-family: 'Onest';
			font-style: normal;
			font-weight: 100 900;
			font-display: swap;
			src: url('/fonts/onest-cyrillic.woff2') format('woff2');
			unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
		}

		@font-face {
			font-family: 'Onest';
			font-style: normal;
			font-weight: 100 900;
			font-display: swap;
			src: url('/fonts/onest-latin-ext.woff2') format('woff2');
			unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
		}

		@font-face {
			font-family: 'Onest';
			font-style: normal;
			font-weight: 100 900;
			font-display: swap;
			src: url('/fonts/onest-latin.woff2') format('woff2');
			unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
		}

		:root {
			--pf-color: #00388D;
			--pf-accent: #0048F0;
			--pf-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
			--pf-ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
		}

		* { box-sizing: border-box; }

		html, body { height: 100%; }

		body {
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			font-family: Onest, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
			color: var(--pf-color);
			background:
				radial-gradient(60vmax 50vmax at 85% 10%, rgba(0, 72, 240, 0.08), transparent 60%),
				#fff;
			text-align: center;
		}

		main { display: flex; flex-direction: column; align-items: center; gap: 20px; }

		.code {
			position: relative;
			display: flex;
			margin: 0;
			font-size: clamp(120px, 30vw, 260px);
			font-weight: 800;
			line-height: 1;
			letter-spacing: -0.05em;
		}

		.code span {
			display: inline-block;
			animation: drop 1000ms var(--pf-ease-bounce) both;
		}

		.code span:nth-child(2) { animation-delay: 90ms; }
		.code span:nth-child(3) { animation-delay: 180ms; }

		@keyframes drop {
			from { opacity: 0; transform: translateY(-0.6em) rotate(-10deg); filter: blur(10px); }
			to { opacity: 1; transform: none; filter: none; }
		}

		/* A focus reticle hunts around and finally locks onto the zero */
		.reticle {
			position: absolute;
			left: 34%;
			top: 8%;
			width: 32%;
			height: 84%;
			animation: hunt 2600ms var(--pf-ease-out) 400ms both;
		}

		.reticle i {
			position: absolute;
			width: 18%;
			height: 12%;
			border: 0 solid var(--pf-accent);
		}

		.reticle i:nth-child(1) { left: 0; top: 0; border-top-width: 5px; border-left-width: 5px; border-top-left-radius: 8px; }
		.reticle i:nth-child(2) { right: 0; top: 0; border-top-width: 5px; border-right-width: 5px; border-top-right-radius: 8px; }
		.reticle i:nth-child(3) { right: 0; bottom: 0; border-bottom-width: 5px; border-right-width: 5px; border-bottom-right-radius: 8px; }
		.reticle i:nth-child(4) { left: 0; bottom: 0; border-bottom-width: 5px; border-left-width: 5px; border-bottom-left-radius: 8px; }

		@keyframes hunt {
			0% { opacity: 0; transform: translate(-90%, 10%) scale(1.3); }
			20% { opacity: 1; transform: translate(-90%, 10%) scale(1.3); }
			45% { transform: translate(95%, -6%) scale(0.8); }
			70% { transform: translate(10%, 4%) scale(1.2); }
			85% { transform: scale(0.94); }
			100% { opacity: 1; transform: none; }
		}

		h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); font-weight: 800; letter-spacing: -0.02em; }

		p { margin: 0; max-width: 32ch; font-size: 18px; line-height: 1.5; color: rgba(0, 56, 141, 0.78); }

		.copy { animation: rise 900ms var(--pf-ease-out) 700ms both; display: grid; gap: 10px; justify-items: center; }

		@keyframes rise {
			from { opacity: 0; transform: translateY(16px); }
			to { opacity: 1; transform: none; }
		}

		.home {
			position: relative;
			isolation: isolate;
			overflow: hidden;
			display: inline-flex;
			align-items: center;
			margin-top: 12px;
			padding: 0.375rem 3rem;
			border: 1px solid var(--pf-color);
			border-radius: 50rem;
			color: var(--pf-color);
			font-size: 1.25rem;
			line-height: 1.5;
			text-decoration: none;
			transition: color 450ms var(--pf-ease-out), transform 600ms var(--pf-ease-bounce), box-shadow 450ms ease;
		}

		.home::before {
			content: '';
			position: absolute;
			inset: -1px;
			z-index: -1;
			background: var(--pf-color);
			border-radius: 50% 50% 0 0 / 70% 70% 0 0;
			transform: translateY(102%);
			transition: transform 550ms var(--pf-ease-out), border-radius 550ms var(--pf-ease-out);
		}

		.home:hover,
		.home:focus-visible {
			color: #fff;
			transform: translateY(-4px) scale(1.02);
			box-shadow: 0 1rem 2rem rgba(0, 72, 240, 0.18);
		}

		.home:hover::before,
		.home:focus-visible::before {
			transform: none;
			border-radius: 0;
		}

		.home:focus-visible { outline: 2px solid var(--pf-accent); outline-offset: 3px; }

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
		}
	</style>
</head>
<body>
	<main>
		<div class="code" aria-hidden="true">
			<span>4</span><span>0</span><span>4</span>
			<div class="reticle"><i></i><i></i><i></i><i></i></div>
		</div>
		<div class="copy">
			<h1>Lost focus</h1>
			<p>This level doesn’t exist — maybe it’s still in development.</p>
			<a class="home" href="/">Back to playfocus</a>
		</div>
	</main>
</body>
</html>
